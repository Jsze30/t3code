name: Sync upstream

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN cannot push commits that touch .github/workflows, and upstream often does.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Rebase onto upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main
          git push --force origin refs/remotes/upstream/main:refs/heads/main
          git rebase upstream/main
          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"

      # Upstream release and deploy workflows have schedules and need secrets this fork lacks.
      - name: Keep upstream workflows disabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # The upstream remote added above would otherwise make gh target pingdotgg/t3code.
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow list --all --json id,path,state \
            -q '.[] | select(.state == "active" and (.path | startswith(".github/workflows/")) and .path != ".github/workflows/sync-upstream.yml") | .id' \
            | xargs -r -n1 gh workflow disable
